spring.application.name=videostream

# --------------------------------
# Database
# --------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:videostream}
spring.datasource.username=${DB_USER:XOXOXyourName}
spring.datasource.password=${DB_PASSWORD:XOXOXchooseSafePasswords}

# --------------------------------
# JPA / Hibernate
# --------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --------------------------------
# Logging
# --------------------------------
logging.level.org.springframework.web=DEBUG
#logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE

# --------------------------------
# Media
# --------------------------------
app.media.root-path=${MEDIA_ROOT:D:/Medien}
